# PostgreSQL + PostGIS for Razom. The schema is created by Alembic when the
# backend starts. Host port 5433 avoids clashing with a local PostgreSQL.
# Run:  docker compose up -d db
services:
  db:
    image: postgis/postgis:16-3.4
    container_name: razom-db
    environment:
      POSTGRES_USER: razom
      POSTGRES_PASSWORD: razom
      POSTGRES_DB: razom
    ports:
      - "5433:5432"
    volumes:
      - razom-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U razom"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  razom-db-data:
